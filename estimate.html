<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>見積相談｜TripleEight</title>
<meta name="description" content="公式LINE構築・LP・HP・業務改善。選ぶだけで概算がわかり、そのままLINEで相談できます。">
<style>
:root{
  --main:#001743;
  --accent:#d6aaa7;
  --bg:#f4f6f9;
  --card:#fff;
  --line:#dfe3e8;
  --text:#1a1d21;
  --muted:#6c7480;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.75;
  -webkit-font-smoothing:antialiased;padding-bottom:60px;
}
.wrap{max-width:620px;margin:0 auto;padding:0 16px}
.head{background:var(--main);color:#fff;padding:30px 0 26px;text-align:center}
.head .brand{font-size:12px;font-weight:800;letter-spacing:.18em;color:var(--accent);margin-bottom:10px}
.head h1{font-size:22px;font-weight:800;line-height:1.5}
.head p{font-size:13.5px;opacity:.85;margin-top:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 20px;margin-top:16px}
.card h2{font-size:15px;font-weight:800;color:var(--main);margin-bottom:12px}
label.q{display:block;font-size:14px;font-weight:800;margin:18px 0 8px}
label.q small{font-weight:600;color:var(--muted)}
select,input[type=text],textarea{
  width:100%;font-size:16px;padding:13px 14px;border:1.5px solid var(--line);
  border-radius:10px;background:#fff;color:var(--text);appearance:none;font-family:inherit;
}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--main)}
.price{
  display:none;background:#f6f8fc;border:1.5px solid var(--main);border-radius:12px;
  padding:16px 18px;margin-top:14px;
}
.price .t{font-size:12.5px;font-weight:800;color:var(--muted);letter-spacing:.06em}
.price .v{font-size:26px;font-weight:800;color:var(--main);line-height:1.4}
.price .v small{font-size:14px}
.price .n{font-size:12.5px;color:var(--muted);margin-top:4px}
.btn{
  display:block;width:100%;text-align:center;background:#06c755;color:#fff;
  font-size:16.5px;font-weight:800;padding:16px;border:none;border-radius:12px;
  margin-top:22px;cursor:pointer;font-family:inherit;
}
.btn small{display:block;font-size:12px;font-weight:700;opacity:.9;margin-top:2px}
.hint{font-size:12.5px;color:var(--muted);margin-top:10px;text-align:center}
.err{color:#c7000b;font-size:13px;font-weight:700;margin-top:10px;display:none;text-align:center}
.foot{margin-top:30px;text-align:center;font-size:12.5px;color:var(--muted)}
.foot b{color:var(--main)}
</style>
</head>
<body>

<div class="head">
  <div class="wrap">
    <div class="brand">TRIPLEEIGHT</div>
    <h1>見積相談</h1>
    <p>選ぶだけで概算がわかります。相談は無料・30分</p>
  </div>
</div>

<div class="wrap">

  <div class="card">
    <h2>ご相談内容（1分）</h2>

    <label class="q" for="prod">ご相談したいこと</label>
    <select id="prod">
      <option value="">選んでください</option>
      <option value="line">公式LINEを作りたい（構築）</option>
      <option value="lp">LPを作りたい</option>
      <option value="hp">HPを作りたい</option>
      <option value="consult">業務改善・仕組み化の相談（コンサルティング）</option>
      <option value="system">業務のシステム化・その他</option>
    </select>

    <div class="price" id="price">
      <div class="t">概算の目安</div>
      <div class="v" id="priceV"></div>
      <div class="n" id="priceN"></div>
    </div>

    <label class="q" for="name">会社名・お名前</label>
    <input type="text" id="name" placeholder="例：株式会社◯◯　山田">

    <label class="q" for="memo">困りごと・やりたいこと</label>
    <textarea id="memo" rows="3" placeholder="例：見積づくりに毎晩2時間かかっている／問い合わせの入口を作りたい"></textarea>

    <label class="q" for="when">希望時期</label>
    <select id="when">
      <option value="">選んでください</option>
      <option>今月中に始めたい</option>
      <option>1〜2ヶ月以内</option>
      <option>3ヶ月以内</option>
      <option>未定（まず話を聞きたい）</option>
    </select>

    <button class="btn" id="send">この内容でLINEで相談する<small>内容が自動で入力されます。送信して完了です</small></button>
    <p class="err" id="err">ご相談内容・お名前・希望時期を入れてください</p>
    <p class="hint">確定のお見積りは、内容を伺ったうえで見積書でご提示します。<br>48時間以内にお返事します。</p>
  </div>

  <div class="foot">
    <b>TripleEight</b>｜河村杜永（もりお）<br>社長の時間を、利益に変える。
  </div>
</div>

<script>
const PRICES = {
  line:    {label:'公式LINE構築',            v:'98,000円<small>（税込）</small>〜', n:'内容により変わります。確定額は見積書でご提示します'},
  lp:      {label:'LP制作',                  v:'148,000円<small>（税込）</small>〜', n:'内容により変わります。確定額は見積書でご提示します'},
  hp:      {label:'HP制作',                  v:'198,000円<small>（税込）</small>〜', n:'内容により変わります。確定額は見積書でご提示します'},
  consult: {label:'業務改善コンサルティング', v:'個別お見積り', n:'まず無料相談（30分）で、いちばん先に外せる仕事を1つ決めます'},
  system:  {label:'システム化・その他',       v:'個別お見積り', n:'内容を伺ってからお見積りします。無料相談からどうぞ'}
};
const prod = document.getElementById('prod');
prod.addEventListener('change',()=>{
  const p = PRICES[prod.value];
  const box = document.getElementById('price');
  if(!p){ box.style.display='none'; return; }
  document.getElementById('priceV').innerHTML = p.v;
  document.getElementById('priceN').textContent = p.n;
  box.style.display='block';
});
document.getElementById('send').addEventListener('click',()=>{
  const p = PRICES[prod.value];
  const name = document.getElementById('name').value.trim();
  const memo = document.getElementById('memo').value.trim();
  const when = document.getElementById('when').value;
  const err = document.getElementById('err');
  if(!p || !name || !when){ err.style.display='block'; return; }
  err.style.display='none';
  const text = '【見積相談】\n'
    + 'ご相談：' + p.label + '\n'
    + '会社名・お名前：' + name + '\n'
    + (memo ? '困りごと：' + memo + '\n' : '')
    + '希望時期：' + when;
  location.href = 'https://line.me/R/oaMessage/%40210uvwaj/?' + encodeURIComponent(text);
});
</script>
</body>
</html>
